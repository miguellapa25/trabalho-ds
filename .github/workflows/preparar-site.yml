name: Preparar site do Miguel para o GitHub Pages

on:
  push:
    branches:
      - miguel-lapa
    paths:
      - ".github/workflows/preparar-site.yml"
      - "Pagina_Lapa_branch_miguel.zip"

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos da branch
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Extrair site do ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q -o Pagina_Lapa_branch_miguel.zip \
            'trabalho-ds/Pagina_Lapa.html' \
            'trabalho-ds/style.css' \
            'trabalho-ds/imagens/*' \
            -d "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/site/trabalho-ds/Pagina_Lapa.html" ./Pagina_Lapa.html
          cp "$RUNNER_TEMP/site/trabalho-ds/style.css" ./style.css
          cp -R "$RUNNER_TEMP/site/trabalho-ds/imagens" ./imagens
          cp ./Pagina_Lapa.html ./index.html
          touch .nojekyll

      - name: Publicar arquivos extraidos na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pagina_Lapa.html index.html style.css imagens .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publica pagina do Miguel para GitHub Pages"
            git push origin HEAD:miguel-lapa
          fi
