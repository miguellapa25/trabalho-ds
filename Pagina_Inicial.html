
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="icon" href="imagens/louvre-paris/botao-de-inicio.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f3;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: white;
            padding: 35px 20px;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            font-size: 27px;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 19px;
            font-weight: normal;
            color: #666;
            margin: 35px 15px;
        }

        .integrantes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: auto;
            padding: 10px 25px 40px;
        }

        .pessoa {
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            width: 230px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .pessoa img {
            width: 200px;
            height: 230px;
            object-fit: cover;
            object-position: center;
            border-radius: 7px;
            border: 1px solid #eee;
        }

        /* Foto do Miguel */
        .fotoMiguel {
            object-fit: contain !important;
            object-position: center !important;
            background-color: #f5f5f3;
        }

        .pessoa h3 {
            font-size: 18px;
            color: #444;
            margin: 15px 0;
        }

        .pessoa a {
            display: inline-block;
            text-decoration: none;
            background-color: #eae8e4;
            color: #444;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.3s;
        }

        .pessoa a:hover {
            background-color: #d8d5d0;
        }

        footer {
            background-color: white;
            border-top: 1px solid #ddd;
            padding: 18px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 22px;
            }

            h2 {
                font-size: 17px;
            }

            .pessoa {
                width: 85%;
                max-width: 280px;
            }

            .pessoa img {
                width: 100%;
            }
        }
    </style>
</head>

<body id="topo">

    <header>
        <h1>Trabalho de Desenvolvimento de Sistemas</h1>
    </header>

    <h2>Conheça mais sobre os nossos integrantes:</h2>

    <div class="integrantes">

        <div class="pessoa">
            <img src="imagens/louvre-paris/eu_lingua_inteira.webp" alt="Foto da Amanda">
            <h3>Amanda</h3>
            <a href="Pagina_Amanda.html">Conhecer mais</a>
        </div>

        <div class="pessoa">
            <img src="imagens/louvre-paris/Foto Angella 01.jpeg" alt="Foto da Angella">
            <h3>Angella</h3>
            <a href="Pagina_Angella.html">Conhecer mais</a>
        </div>

        <div class="pessoa">
            <img src="imagens/louvre-paris/Foto.jpeg" alt="Foto da Beatriz">
            <h3>Beatriz</h3>
            <a href="Pagina_Beatriz.html">Conhecer mais</a>
        </div>

        <div class="pessoa">
            <img
                src="imagens/louvre-paris/WhatsApp Image 2026-05-26 at 14.48.36.jpeg"
                alt="Foto do Miguel Lapa"
                class="fotoMiguel"
            >
            <h3>Miguel Lapa</h3>
            <a href="Pagina_Lapa.html">Conhecer mais</a>
        </div>

    </div>


    <footer>
        Trabalho escolar - Desenvolvimento de Sistemas
    </footer>

</body>
</html>
